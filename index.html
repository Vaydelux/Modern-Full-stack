    <script>
      (function () {
        try {
          var stored = localStorage.getItem("z2m:theme");
          var theme = stored === "light" || stored === "dark" ? stored : "dark";

          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
