<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b100e" />
      <stop offset="60%" stop-color="#121b16" />
      <stop offset="100%" stop-color="#18231d" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ddc97" />
      <stop offset="50%" stop-color="#5ac8e8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#23342a" stroke-width="1" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="#26382e" stroke-width="2" />

  <!-- Top Badge -->
  <rect x="80" y="80" width="280" height="38" rx="19" fill="#18271f" stroke="#3ddc97" stroke-width="1.5" />
  <text x="100" y="104" font-family="monospace" font-size="14" font-weight="bold" fill="#3ddc97" letter-spacing="2">ZERO TO MASTERY</text>
  <circle cx="335" cy="99" r="5" fill="#3ddc97" />

  <!-- Main Title -->
  <text x="80" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#f0fdf4" letter-spacing="-1">
    Modern Full-Stack
  </text>
  <text x="80" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#brand)" letter-spacing="-1">
    Web Development
  </text>

  <!-- Subtitle -->
  <text x="80" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#9cb0a4">
    A living, project-first curriculum: React + Next.js + NestJS + Fastify + Prisma + Supabase
  </text>
  <text x="80" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" fill="#72857b">
    From fundamental web protocols to scalable, production-grade distributed architecture.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 410)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="48" rx="12" fill="#15211a" stroke="#2c4034" stroke-width="1.5" />
    <text x="24" y="30" font-family="monospace" font-size="15" font-weight="600" fill="#3ddc97">45 PHASES (P00–P44)</text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="160" height="48" rx="12" fill="#15211a" stroke="#2c4034" stroke-width="1.5" />
    <text x="219" y="30" font-family="monospace" font-size="15" font-weight="600" fill="#5ac8e8">108 LESSONS</text>

    <!-- Pill 3 -->
    <rect x="370" y="0" width="175" height="48" rx="12" fill="#15211a" stroke="#2c4034" stroke-width="1.5" />
    <text x="394" y="30" font-family="monospace" font-size="15" font-weight="600" fill="#f5b759">REAL CODE LABS</text>

    <!-- Pill 4 -->
    <rect x="560" y="0" width="170" height="48" rx="12" fill="#15211a" stroke="#2c4034" stroke-width="1.5" />
    <text x="584" y="30" font-family="monospace" font-size="15" font-weight="600" fill="#c084fc">ZERO CONFIG</text>
  </g>

  <!-- Right Side Decorative Graphic -->
  <g transform="translate(870, 150)">
    <rect width="240" height="340" rx="20" fill="#121d17" stroke="#2d4236" stroke-width="2" />
    <circle cx="36" cy="36" r="6" fill="#f87171" />
    <circle cx="56" cy="36" r="6" fill="#fbbf24" />
    <circle cx="76" cy="36" r="6" fill="#34d399" />
    
    <!-- Code lines -->
    <rect x="24" y="70" width="140" height="10" rx="5" fill="#3ddc97" opacity="0.8" />
    <rect x="24" y="95" width="190" height="10" rx="5" fill="#5ac8e8" opacity="0.7" />
    <rect x="24" y="120" width="110" height="10" rx="5" fill="#f5b759" opacity="0.7" />
    <rect x="24" y="145" width="160" height="10" rx="5" fill="#c084fc" opacity="0.7" />
    
    <rect x="24" y="185" width="192" height="1" fill="#2d4236" />
    
    <rect x="24" y="210" width="170" height="10" rx="5" fill="#3ddc97" opacity="0.9" />
    <rect x="24" y="235" width="130" height="10" rx="5" fill="#5ac8e8" opacity="0.6" />
    <rect x="24" y="260" width="180" height="10" rx="5" fill="#9cb0a4" opacity="0.4" />
  </g>

  <!-- Footer Info -->
  <text x="80" y="555" font-family="monospace" font-size="13" fill="#607368" letter-spacing="1">
    PRODUCTION READY ARCHITECTURE · VERCEL READY SPA · OFFLINE PERSISTENCE
  </text>
</svg>
